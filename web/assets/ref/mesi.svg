<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Consolas,monospace">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker></defs>
<rect width="640" height="380" fill="#ffffff"/>
<text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#14304d">MESI cache-coherence states</text>

<g fill="#e8f1fb" stroke="#1f6fb8" stroke-width="3">
<circle cx="170" cy="110" r="52"/><circle cx="470" cy="110" r="52"/>
<circle cx="170" cy="280" r="52"/><circle cx="470" cy="280" r="52"/>
</g>
<g text-anchor="middle" fill="#14304d">
<text x="170" y="108" font-size="26" font-weight="bold">M</text><text x="170" y="130" font-size="11">Modified</text>
<text x="470" y="108" font-size="26" font-weight="bold">E</text><text x="470" y="130" font-size="11">Exclusive</text>
<text x="170" y="278" font-size="26" font-weight="bold">S</text><text x="170" y="300" font-size="11">Shared</text>
<text x="470" y="278" font-size="26" font-weight="bold">I</text><text x="470" y="300" font-size="11">Invalid</text>
</g>

<!-- E -> M along the top -->
<line x1="416" y1="110" x2="226" y2="110" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="320" y="100" text-anchor="middle" font-size="11" fill="#2a3b4d">write hit</text>

<!-- I -> E up the right side -->
<line x1="470" y1="226" x2="470" y2="166" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="484" y="200" font-size="11" fill="#2a3b4d">read miss,</text>
<text x="484" y="214" font-size="11" fill="#2a3b4d">no sharer</text>

<!-- I -> S along the bottom -->
<line x1="416" y1="280" x2="226" y2="280" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="320" y="300" text-anchor="middle" font-size="11" fill="#2a3b4d">read miss, shared</text>

<!-- S <-> M on the left, two arcs that do not share a path -->
<path d="M152 230 C128 196 128 162 152 162" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="36" y="198" font-size="11" fill="#2a3b4d">write hit,</text>
<text x="36" y="212" font-size="11" fill="#2a3b4d">invalidate</text>
<path d="M190 162 C214 196 214 230 190 230" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="222" y="198" font-size="11" fill="#2a3b4d">snoop read,</text>
<text x="222" y="212" font-size="11" fill="#2a3b4d">write back</text>

<!-- M -> I across the diagonal -->
<line x1="214" y1="148" x2="428" y2="244" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="330" y="186" text-anchor="middle" font-size="11" fill="#2a3b4d">snoop write</text>

<!-- a transition that returns to its own state -->
<path d="M122 300 C78 316 78 258 118 266" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#m)"/>
<text x="56" y="336" font-size="11" fill="#2a3b4d">read hit</text>

<text x="320" y="360" text-anchor="middle" font-size="11" fill="#6b7280">the line is in exactly one of these four states at any moment</text>
</svg>
