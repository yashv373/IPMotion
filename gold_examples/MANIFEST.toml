# Index status for gold examples (gold files themselves are read-only).
# status: "indexable" = may be embedded into the RAG store
#         "excluded"  = must not be indexed (reason given)
# lint_role: "baseline"   = must lint with zero errors
#            "known_bad"  = lint must report the listed defects
#            "none"       = not used as a lint reference

[files."axi_read_handshake.py"]
status = "indexable"
scene = "AxiReadHandshakeScene"
lint_role = "baseline"
reason = "Renders cleanly; reference layout for master/slave channels."
notes = "Lints with 0 errors (M1). Accepted warnings: blocks 0.08 from frame edge, banner wider than frame (full-bleed bar). Banner dim-text bug fixed in ipmotion_lib.Banner.update_text."

[files."darjeeling_full.py"]
status = "excluded"
scene = "DarjeelingFull"
lint_role = "known_bad"
reason = "Renders, but the layout has overlapping blocks and hidden text; indexing it would teach overlaps."
known_defects = [
  "Low-Speed blocks overlap Hi-Speed blocks and straddle the Hi-Speed domain border (min_spacing errors)",
  "CSRNG (98%), Debug Module (75%), JTAG Mailbox (75%), Dbg Crossbar (90%) are covered by later-drawn Low-Speed blocks (text_occluded)",
  "~45 labels render below the 12px cap-height warning level (min_text_size warnings)",
]
# note: the earlier claim "'ROM Partitions' text overflows its block" was NOT confirmed by the linter.

